# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — @mtools Monorepo
#
# STATUS: ACTIVE
# This file is live in .github/workflows/ and runs on every push to main.
#
# TO DEACTIVATE:
#   mv .github/workflows/ci.yml .github/workflows-disabled/ci.yml
#   git add .github/workflows-disabled/ci.yml
#   git commit -m "ci: deactivate CI pipeline"
#
# PURPOSE: Shared quality gate — runs on every push to main regardless of
# which site changed. Lints, checks types, and builds affected packages.
# Deployment is handled separately in per-site deploy-*.yml files.
#
# JOBS:
#   1. ci — Install, lint, type-check, build (Turborepo affected-only)
#
# Per-site deploy files (in .github/workflows/):
#   - deploy-onlineqrcodescanner-com.yml  → onlineqrcodescanner.com
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  # Only trigger on pushes to the main branch.
  # Feature branches, PRs, and other branches are ignored.
  push:
    branches:
      - main

  # Allow manual triggering from the GitHub Actions UI.
  # Useful for verifying the build without a code change.
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a newer push arrives.
# Prevents duplicate runs when you push multiple commits quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match engines.node in root package.json (>=22)
  NODE_VERSION: "22"
  # Note: pnpm version is read automatically from packageManager in package.json
  # by pnpm/action-setup@v4 — no need to specify it here.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job: CI — Install, Lint, Type-check, Build
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Install / Lint / Check / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 is required so Turborepo can compare HEAD~1 for
          # affected packages. If you change the filter strategy, update this.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        # --frozen-lockfile: fail if pnpm-lock.yaml is out of sync.
        # This catches the "works on my machine" problem early.
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint
        # eslint . is not a turbo task — runs directly and covers the whole repo.
        # Fails fast on lint errors before spending time on type-checks and builds.
        run: pnpm lint

      - name: Type-check affected packages
        # Runs check:astro, check:svelte, check:tsc for packages changed since HEAD~1.
        # These are separate turbo tasks (not chained to build) — must be run explicitly.
        # --filter=...[HEAD~1] means: changed packages and all their dependents.
        run: pnpm turbo check:astro check:svelte check:tsc --filter=...[HEAD~1]

      - name: Build affected packages
        # --filter=...[HEAD~1]: only rebuild what changed since the last commit.
        # In a monorepo with multiple sites, this avoids rebuilding everything
        # every time. If core changes, all dependent sites rebuild automatically.
        #
        # NOTE: This compares against HEAD~1 (one commit back). Works correctly
        # for single-commit pushes. If you regularly push multiple commits at
        # once or use squash merges, consider switching to:
        #   --filter=...[origin/main]
        # and setting fetch-depth: 0 above.
        run: pnpm turbo build --filter=...[HEAD~1]
        env:
          # Pass all known PUBLIC_ env vars here so any affected site builds
          # correctly. Sites that don't use a variable will simply ignore it.
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}  # Optional: Turborepo remote cache
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}    # Optional: Turborepo remote cache

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Uploads dist/ for each site so deploy jobs in separate workflow
          # files can download it without re-building.
          name: build-artifacts
          path: |
            sites/*/dist
          retention-days: 1
          if-no-files-found: warn
