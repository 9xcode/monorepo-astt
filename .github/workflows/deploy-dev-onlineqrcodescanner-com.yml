# ─────────────────────────────────────────────────────────────────────────────
# Dev Preview — onlineqrcodescanner.com → Cloudflare Pages
#
# STATUS: ACTIVE
# This file deploys a preview environment on every push to the `dev` branch.
#
# PREREQUISITES:
#   CLOUDFLARE_API_TOKEN      
#   CLOUDFLARE_ACCOUNT_ID     
#   PUBLIC_WEB3FORMS_ACCESS_KEY
# ─────────────────────────────────────────────────────────────────────────────

name: Dev Preview — onlineqrcodescanner.com

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - dev
  #   paths:
  #     - 'sites/onlineqrcodescanner-com/**'
  #     - 'core/**'
  #     - 'pnpm-lock.yaml'
  #     - 'pnpm-workspace.yaml'
  #     - 'turbo.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Build & Deploy Dev Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for per-file git dates (content-dates integration)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build QR site
        run: pnpm turbo build --filter=@mtools/onlineqrcodescanner-com
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Install Wrangler globally
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages (Dev Preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy with branch=dev to create a stable preview environment
          command: pages deploy sites/onlineqrcodescanner-com/dist --project-name=onlineqrcodescanner-com --branch=${{ github.ref_name }} --commit-dirty=true
