# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline — @mtools Monorepo
#
# STATUS: DISABLED
# This file lives in .github/workflows-disabled/ intentionally.
# GitHub Actions only reads .github/workflows/ — this file does nothing here.
#
# TO ACTIVATE:
#   mv .github/workflows-disabled/ci.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml
#   git commit -m "ci: activate CI/CD pipeline"
#
# TRIGGERS:
#   - Push to `main` only (PRs, feature branches → no deploy, no build)
#   - Manual trigger (workflow_dispatch) for on-demand builds
#
# JOBS:
#   1. ci        — Install, type-check, build (Turborepo affected-only)
#   2. deploy-*  — One job per site (see DEPLOYMENT SETUP below)
#
# DEPLOYMENT SETUP (fill in before activating):
#   This pipeline has placeholder deploy jobs. Uncomment the block for your
#   hosting provider and add the required secrets to your GitHub repo:
#   Settings → Secrets and variables → Actions → New repository secret
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  # Only trigger on pushes to the main branch.
  # Feature branches, PRs, and other branches are ignored.
  push:
    branches:
      - main

  # Allow manual triggering from the GitHub Actions UI.
  # Useful for deploying without a code change (e.g. after env var update).
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a newer push arrives.
# Prevents duplicate deploys when you push multiple commits quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node.js version — must match your local environment
  NODE_VERSION: "20"
  # pnpm version — must match packageManager field in root package.json
  PNPM_VERSION: "10"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: CI — Install, Check, Build
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Install / Check / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so Turborepo can compare HEAD~1 for affected packages
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        # --frozen-lockfile: fail if pnpm-lock.yaml is out of sync
        # This catches the "works on my machine" problem early
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build affected packages
        # --filter=...[HEAD~1]: only rebuild what changed since the last commit.
        # In a monorepo with multiple sites, this avoids rebuilding everything
        # every time. If core changes, all sites that depend on it rebuild too.
        run: pnpm turbo build --filter=...[HEAD~1]
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}       # Optional: Turborepo remote cache
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}         # Optional: Turborepo remote cache

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Uploads the built dist/ for each site so deploy jobs can use it
          # without re-building.
          name: build-artifacts
          path: |
            sites/*/dist
          retention-days: 1
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy — finance-tools
  #
  # Runs only after the CI job passes.
  # Uncomment ONE of the provider blocks below, add the required secrets,
  # then remove the other blocks.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-finance-tools:
    name: Deploy finance-tools
    runs-on: ubuntu-latest
    needs: ci                         # Only runs if the CI job passes
    timeout-minutes: 10
    # Only deploy on direct pushes to main (not on workflow_dispatch dry-runs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # ── OPTION A: Vercel ───────────────────────────────────────────────────
      # Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_FINANCE_TOOLS
      # Get them from: vercel.com → Project Settings → General
      #
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FINANCE_TOOLS }}
      #     working-directory: sites/finance-tools
      #     vercel-args: "--prod"

      # ── OPTION B: Netlify ──────────────────────────────────────────────────
      # Required secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID_FINANCE_TOOLS
      # Get them from: app.netlify.com → Site Settings → General
      #
      # - name: Deploy to Netlify
      #   uses: nwtgck/actions-netlify@v3
      #   with:
      #     publish-dir: sites/finance-tools/dist
      #     production-branch: main
      #     production-deploy: true
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_FINANCE_TOOLS }}

      # ── OPTION C: Cloudflare Pages ─────────────────────────────────────────
      # Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
      # Required: set CLOUDFLARE_PROJECT_NAME to your CF Pages project name
      #
      # - name: Deploy to Cloudflare Pages
      #   uses: cloudflare/pages-action@v1
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     projectName: finance-tools          # Your CF Pages project name
      #     directory: sites/finance-tools/dist
      #     gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # ── PLACEHOLDER (remove when you uncomment a provider above) ───────────
      - name: Deploy step not configured
        run: |
          echo "⚠️  No deployment provider configured for finance-tools."
          echo "Open .github/workflows-disabled/ci.yml and uncomment one of:"
          echo "  - OPTION A: Vercel"
          echo "  - OPTION B: Netlify"
          echo "  - OPTION C: Cloudflare Pages"
          echo "Then move the file to .github/workflows/ci.yml to activate."

  # ───────────────────────────────────────────────────────────────────────────
  # Add more deploy jobs here as you add more sites.
  # Copy the deploy-finance-tools job above, rename it, and change:
  #   - The job name (deploy-my-new-site)
  #   - working-directory / publish-dir (sites/my-new-site)
  #   - The project ID / site ID secret name
  # ───────────────────────────────────────────────────────────────────────────
